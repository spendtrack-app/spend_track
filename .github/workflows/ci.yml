name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install open-source Gitleaks CLI
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$install_dir/$archive"
          cd "$install_dir"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          ./gitleaks version
      - name: Scan complete Git history for secrets
        run: gitleaks git --log-opts="--all" --redact --exit-code=1 .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in app.js seed.js api-config.js playwright.config.js server/*.js scripts/*.js test/*.js test/support/*.js e2e/*.js e2e/support/*.js; do node --check "$f"; done
      - name: Shell script lint
        run: shellcheck -S warning scripts/*.sh
      - name: No env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env file is tracked"; exit 1; fi

  # Proves the setup reproduces from scratch: clean runner + empty MySQL ->
  # non-interactive setup -> integration tests, smoke test, browser e2e.
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    # Config goes to the default ~/.config/spend_track/.env, outside the checkout.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup (non-interactive)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_SSL: "off"
          ST_EMAIL: demo@example.test
          ST_PASSWORD: ci-demo-password
        run: bash scripts/setup.sh --yes
      - run: npm test
      - name: Start server
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 60); do curl -fs -o /dev/null http://localhost:3000/ && exit 0; sleep 0.5; done
          cat server.log; exit 1
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Server log
        if: always()
        run: cat server.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Proves the server install is portable: a clean Ubuntu machine with real systemd,
  # installed with scripts/install-ubuntu.sh, then updated in place to HTTPS behind Caddy.
  ubuntu-install:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install (plain HTTP)
        run: >-
          sudo DB_HOST=127.0.0.1 DB_USER=root DB_PASSWORD=ci-root-password DB_SSL=off
          ST_EMAIL=demo@example.test ST_PASSWORD=ci-demo-password
          bash scripts/install-ubuntu.sh
      - name: Service, config, and hardening
        run: |
          set -x
          systemctl is-active spend-track
          systemctl is-enabled spend-track
          curl -fsS http://127.0.0.1:3000/api/health
          test "$(sudo stat -c '%a %U' /etc/spend_track/.env)" = "600 spendtrack"
          ! sudo grep -q ci-root-password /etc/spend_track/.env   # admin password is not kept
          ! sudo -u spendtrack touch /opt/spend_track/probe        # app cannot modify its code
          ! sudo -u spendtrack cat /etc/shadow
          systemd-analyze security spend-track --no-pager | tail -1
      - run: npm ci
      - name: Smoke test (HTTP)
        run: sudo SPEND_TRACK_ENV_FILE=/etc/spend_track/.env /usr/bin/node scripts/smoke.js http://127.0.0.1:3000
      - name: Restarts after a crash
        run: |
          sudo kill -9 "$(systemctl show -p MainPID --value spend-track)"
          for i in $(seq 40); do sleep 0.5; curl -fs -o /dev/null http://127.0.0.1:3000/api/health && exit 0; done
          exit 1
      - name: Update in place with HTTPS (Caddy, DOMAIN=localhost uses Caddy's internal CA)
        run: sudo DOMAIN=localhost bash scripts/install-ubuntu.sh
      - name: HTTPS works and the app is no longer exposed directly
        run: |
          set -x
          # Caddy issues the localhost certificate asynchronously at startup.
          for i in $(seq 40); do curl -fsk -o /dev/null https://localhost/api/health && break; sleep 0.5; done
          curl -fsSk https://localhost/api/health
          curl -fsSk -o /dev/null -D - https://localhost/ | grep -i strict-transport-security
          ! curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):3000/api/health"
          sudo NODE_TLS_REJECT_UNAUTHORIZED=0 SPEND_TRACK_ENV_FILE=/etc/spend_track/.env /usr/bin/node scripts/smoke.js https://localhost
      - name: Logs
        if: always()
        run: sudo journalctl -u spend-track -u caddy --no-pager -n 100 || true
